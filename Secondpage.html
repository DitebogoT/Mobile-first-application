<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | MecerInter-Ed Socials</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="back-link" href="Firstpage.html">Back to home</a>
    </header>
    <main class="contact-page">
      <h1>Contact Us</h1>
        <form class="contact-form" action="mailto:info@mecerinter-ed.com" method="post" enctype="text/plain">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send</button>
          <button type="reset">Cancel</button>
        </form>
    </main>
    <nav class="bottom-navigation" aria-label="Main navigation">
      <ul>
        <li>
          <a href="Firstpage.html" aria-label="Home">
            <img src="images/home-icon.png" alt="" class="bottom-icon" />
          </a>
        </li>
        <li>
          <a href="Firstpage.html#person1" aria-label="About">
            <img src="images/search-icon.jpg" alt="" class="bottom-icon" />
          </a>
        </li>
        <li>
          <a href="Firstpage.html#person2" aria-label="Latest story">
            <img src="images/inbox.jpg" alt="" class="bottom-icon" />
          </a>
        </li>
        <li class="menu-item">
          <details class="menu-dropdown">
            <summary class="menu-toggle" aria-label="Open navigation menu">
              <img src="images/icons8-menu-50.png" alt="" class="bottom-icon" />
            </summary>
            <div class="menu-links">
              <a href="Firstpage.html">Home</a>
              <a href="Firstpage.html#person1">About</a>
              <a href="Secondpage.html">Contact Us</a>
            </div>
          </details>
        </li>
      </ul>
    </nav>
  </body>
</html>
